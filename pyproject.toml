[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-core"
version = "0.1.1"
description = "Name normalisation, shared directories and the versioned export envelope for cross-catalogue media tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "gr8monk3ys" }]
keywords = ["normalisation", "matching", "interchange", "music", "film", "books"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# No runtime dependencies, on purpose: this package is imported by five tools
# with unrelated dependency trees, and a dependency here is a constraint on all
# of them. Everything it needs is in the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/gr8monk3ys/media-core"
Issues = "https://github.com/gr8monk3ys/media-core/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/media_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "E501"]  # asserts are the point; fixture bytes are long

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
